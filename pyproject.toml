[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nonce-watchtower"
version = "0.1.0"
description = "Read-only monitor for Solana durable-nonce accounts, token delegates and authorities held by a set of keys."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = []

[project.scripts]
watchtower = "watchtower.cli:main"

[tool.setuptools]
packages = ["watchtower"]
