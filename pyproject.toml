[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nonce-watchtower"
dynamic = ["version"]
description = "Read-only monitor for Solana durable-nonce accounts, token delegates and authorities held by a set of keys."
readme = {file = "README.md", content-type = "text/markdown"}
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "clawboriclaw"}]
requires-python = ">=3.11"
dependencies = []
keywords = ["solana", "security", "monitoring", "durable-nonce", "multisig", "squads", "websocket", "alerts"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
]

[project.urls]
Homepage = "https://github.com/clawboriclaw/nonce-watchtower"
Repository = "https://github.com/clawboriclaw/nonce-watchtower"
Issues = "https://github.com/clawboriclaw/nonce-watchtower/issues"

[project.scripts]
watchtower = "watchtower.cli:main"

[tool.setuptools]
packages = ["watchtower"]

[tool.setuptools.dynamic]
version = {attr = "watchtower.__version__"}
