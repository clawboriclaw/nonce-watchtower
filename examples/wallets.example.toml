# nonce-watchtower config. Public keys only: this tool never needs or accepts a private key.
# Secrets (RPC provider URL with API key, webhook URL) come from environment variables.
# TOML rule: top-level settings must come BEFORE the first [[wallets]] block.
rpc_url_env = "WATCHTOWER_RPC_URL"
webhook_url_env = "WATCHTOWER_WEBHOOK_URL"
# ws_url_env = "WATCHTOWER_WS_URL"                          # PubSub URL for `stream` (default: derived from the RPC URL)
# telegram_bot_token_env = "WATCHTOWER_TELEGRAM_BOT_TOKEN"
# telegram_chat_id_env = "WATCHTOWER_TELEGRAM_CHAT_ID"      # or: telegram_chat_id = -1001234567890 (not a secret)
# telegram_thread_id_env = "WATCHTOWER_TELEGRAM_THREAD_ID"  # optional forum topic id
# discord_webhook_url_env = "WATCHTOWER_DISCORD_WEBHOOK_URL"
# alert_dedup_seconds = 1800   # an identical alert is not re-sent to a chat sink within this window (stdout gets all)
# state_file = "wallets.state.json"   # default: next to this file

# Squads v4 multisig ACCOUNT addresses (not the vault). Every member, vault 0 and any config
# authority is watched; members are re-read each cycle and changes alert.
# squads = ["<multisig address>"]

# Mints whose mint/freeze/permanent-delegate authorities you want watched.
mints = ["EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v"]

# Program ids whose upgrade authority / redeploy slot you want watched.
programs = ["JUP6LkbZbjS1jKKwapdHNy74zcZ3tLUZoi5QNyVTaV4"]

# One block per key to watch: multisig members, treasury, deployer, payout wallets.
[[wallets]]
label = "council-member-1"
pubkey = "1nc1nerator11111111111111111111111111111111"
